<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📖</text></svg>">
<meta name="robots" content="noindex, nofollow">
<title>Weekly Recipe Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --ground: #faf8f4;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #8c8577;
    --accent: #8a6d3b;
    --accent-ink: #ffffff;
    --border: #e6e0d5;
    --soft: #f4efe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1c1917; --card: #26221d; --ink: #ece7dd; --muted: #9a9184;
      --accent: #c9a468; --accent-ink: #1c1917; --border: #3a342b; --soft: #211d18;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1c1917; --card: #26221d; --ink: #ece7dd; --muted: #9a9184;
    --accent: #c9a468; --accent-ink: #1c1917; --border: #3a342b; --soft: #211d18;
  }
  :root[data-theme="light"] {
    --ground: #faf8f4; --card: #ffffff; --ink: #2b2620; --muted: #8c8577;
    --accent: #8a6d3b; --accent-ink: #ffffff; --border: #e6e0d5; --soft: #f4efe6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--ground); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.45; padding-bottom: 48px;
  }

  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--ground); border-bottom: 1px solid var(--border);
    padding: 12px 18px;
  }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 640px; margin: 0 auto; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.4rem; letter-spacing: 0.2px; min-width: 0; }
  .lang { display: flex; flex: 0 0 auto; border: 1.5px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .lang button {
    font: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px;
    color: var(--accent); background: none; border: none; cursor: pointer;
    min-width: 48px; height: 28px; padding: 0; text-align: center;
  }
  .lang button.on { background: var(--accent); color: var(--accent-ink); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 0; }

  /* ---- Plan panel ---- */
  .plan {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 22px;
  }
  .plan h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.1rem; margin-bottom: 10px; }
  .ppl { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
  .ppl .lbl { font-size: 0.9rem; color: var(--muted); flex: 1; }
  .step-btn {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1.5px solid var(--accent); background: none; color: var(--accent);
    font-size: 1.15rem; font-weight: 700; cursor: pointer; line-height: 1;
  }
  .step-btn:disabled { opacity: 0.35; cursor: default; }
  .step-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ppl b { font-size: 1.25rem; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .mrow:last-of-type { border-bottom: none; }
  .mrow .rname { flex: 1; font-size: 0.92rem; font-weight: 600; }
  .seg { display: flex; border: 1.5px solid var(--accent); border-radius: 9px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 0.82rem; font-weight: 700; padding: 5px 11px;
    background: none; border: none; color: var(--accent); cursor: pointer;
    border-left: 1.5px solid var(--accent);
  }
  .seg button:first-child { border-left: none; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .plan-hint { font-size: 0.76rem; color: var(--muted); margin-top: 10px; }

  /* ---- Cover menu ---- */
  .menu {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; margin-bottom: 14px;
  }
  .menu a {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); text-decoration: none; color: inherit;
  }
  .menu a:last-child { border-bottom: none; }
  .menu .d {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent); font-weight: 700; min-width: 74px;
  }
  .menu .dish { font-family: Georgia, serif; font-size: 1rem; flex: 1; }
  .menu .lo { color: var(--muted); font-size: 0.78rem; }
  .note {
    font-size: 0.82rem; color: var(--muted);
    padding: 10px 12px; border-left: 3px solid var(--accent);
    background: var(--card); border-radius: 0 8px 8px 0; margin-bottom: 26px;
  }
  .note b { color: var(--ink); }

  /* ---- Recipe ---- */
  .recipe {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 16px 18px; margin-bottom: 26px; scroll-margin-top: 70px;
  }
  .recipe.off { opacity: 0.55; }
  .r-head { border-bottom: 2.5px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .day-badge {
    display: inline-block; background: var(--accent); color: var(--accent-ink);
    border-radius: 999px; font-size: 0.68rem; letter-spacing: 1.2px;
    text-transform: uppercase; font-weight: 700; padding: 3px 12px; margin-bottom: 8px;
  }
  h3.r-title { font-family: Georgia, serif; font-size: 1.45rem; font-weight: 400; text-wrap: balance; }
  .r-meta { color: var(--muted); font-size: 0.82rem; margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .r-meta b { color: var(--ink); }
  .r-batch { color: var(--accent); font-weight: 600; }

  .ing {
    background: var(--ground); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 16px; margin-bottom: 16px;
  }
  .ing h4 {
    font-family: Georgia, serif; font-size: 1rem; font-weight: 400;
    border-bottom: 1.5px solid var(--ink); padding-bottom: 4px; margin-bottom: 6px;
  }
  .ing h5 {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--accent); margin: 10px 0 2px;
  }
  .ing ul { list-style: none; }
  .ing li {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    padding: 4px 0; border-bottom: 1px dotted var(--border); font-size: 0.9rem;
  }
  .ing li:last-child { border-bottom: none; }
  .ing .q { color: var(--accent); font-weight: 600; text-align: right; white-space: nowrap; }
  .ing .subnote { font-size: 0.74rem; color: var(--muted); margin-top: 6px; }

  .steps ol { list-style: none; counter-reset: step; }
  .steps li { counter-increment: step; position: relative; padding: 0 0 14px 42px; }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); color: var(--ground);
    font-size: 0.92rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li b { display: block; font-size: 0.95rem; margin-bottom: 2px; }
  .steps li p { font-size: 0.9rem; color: var(--ink); }
  .tipbox {
    background: var(--soft); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 0.84rem; margin-top: 4px;
  }
  .tipbox b { color: var(--accent); }
  .backtop { display: inline-block; margin-top: 12px; font-size: 0.8rem; color: var(--accent); text-decoration: none; font-weight: 600; }
</style>

<header class="top" id="top">
  <div class="head-row">
    <h1 id="title">Weekly Recipe Book</h1>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" type="button">EN</button>
      <button id="lang-fr" type="button">FR</button>
      <button id="lang-zh" type="button">中文</button>
    </div>
  </div>
</header>

<main>
  <section class="plan" id="plan"></section>
  <nav class="menu" id="menu"></nav>
  <p class="note" id="covernote"></p>
  <div id="recipes"></div>
</main>

<script>
  // ---------- units & formatting ----------
  const U = {
    g:    { en: ["g","g"],                 fr: ["g","g"],                     zh: ["克","克"],       step: 10 },
    ml:   { en: ["ml","ml"],               fr: ["ml","ml"],                   zh: ["毫升","毫升"],   step: 10 },
    pc:   { en: ["",""],                   fr: ["",""],                       zh: ["",""],           step: 0.5 },
    slice:{ en: ["slice","slices"],        fr: ["tranche","tranches"],        zh: ["片","片"],       step: 0.5 },
    stalk:{ en: ["stalk","stalks"],        fr: ["tige","tiges"],              zh: ["根","根"],       step: 0.5 },
    clove:{ en: ["clove","cloves"],        fr: ["gousse","gousses"],          zh: ["瓣","瓣"],       step: 1 },
    tbsp: { en: ["tbsp","tbsp"],           fr: ["c. à s.","c. à s."],         zh: ["大匙","大匙"],   step: 0.5 },
    serv: { en: ["serving","servings"],    fr: ["portion","portions"],        zh: ["人份","人份"],   step: 0.5 },
    bag:  { en: ["bag","bags"],            fr: ["sachet","sachets"],          zh: ["包","包"],       step: 0.5 },
    bund: { en: ["bundle","bundles"],      fr: ["paquet","paquets"],          zh: ["把","把"],       step: 0.5 },
    block:{ en: ["block","blocks"],        fr: ["cube","cubes"],              zh: ["塊","塊"],       step: 0.5 },
    sq:   { en: ["square","squares"],      fr: ["carré","carrés"],            zh: ["格","格"],       step: 0.5 },
    leaf: { en: ["leaf","leaves"],         fr: ["feuille","feuilles"],        zh: ["片","片"],       step: 0.5 },
    can:  { en: ["can (300 ml)","cans (300 ml)"], fr: ["canette (300 ml)","canettes (300 ml)"], zh: ["罐（300 毫升）","罐（300 毫升）"], step: 0.5 },
    jar:  { en: ["jar","jar"],             fr: ["bocal","bocal"],             zh: ["瓶","瓶"],       step: 0.25 },
    chick:{ en: ["chicken","chickens"],    fr: ["poulet","poulets"],          zh: ["隻","隻"],       step: 0.25 },
    head: { en: ["small head","small heads"], fr: ["petite tête","petites têtes"], zh: ["小顆","小顆"], step: 0.25 }
  };
  const FRACS = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
  function roundStep(x, s) { return Math.max(s, Math.round(x / s) * s); }
  function fmtN(x, uk) {
    const u = U[uk];
    if (uk === "g" && x >= 1000) return (Math.round(x / 100) / 10) + " kg";
    if (uk === "ml" && x >= 1000) return (Math.round(x / 100) / 10) + " L";
    if (uk === "g" || uk === "ml") return roundStep(x, u.step) + "";
    const r = roundStep(x, u.step);
    const w = Math.floor(r + 1e-9), rem = Math.round((r - w) * 100) / 100;
    if (FRACS[rem]) return (w ? w : "") + FRACS[rem];
    return (Math.round(r * 10) / 10) + "";
  }
  // q: number | [lo,hi] | {txt:{en,fr,zh}}   f: scale factor
  function fmtQ(q, uk, f, approx, lang) {
    if (q && q.txt) return q.txt[lang];
    const range = Array.isArray(q) ? q : [q, q];
    const lo = range[0] * f, hi = range[1] * f;
    const a = fmtN(lo, uk), b = fmtN(hi, uk);
    let s = a === b ? a : a + "–" + b;
    const u = U[uk];
    const label = u[lang][hi > 1 ? 1 : 0];
    if (label && !((uk === "g" || uk === "ml") && hi >= 1000)) s += " " + label;
    return (approx ? "~" : "") + s;
  }

  // ---------- content ----------
  const RECIPES = [
    {
      id: "clam", def: 1,
      name: { en: "Chili Chicken & Clam Soup", fr: "Soupe de poulet aux palourdes et piments", zh: "剝皮辣椒蛤蜊雞湯" },
      short: { en: "Clam soup", fr: "Soupe palourdes", zh: "雞湯" },
      time: "~45 min",
      note: { en: "Taiwanese pickled-chili broth with silkie chicken", fr: "Bouillon taïwanais aux piments au vinaigre et poulet soie", zh: "台式剝皮辣椒湯底配烏骨雞" },
      groups: [
        { label: null, items: [
          { n: { en: "Black-bone (silkie) chicken", fr: "Poulet soie (chair noire)", zh: "烏骨雞" }, q: 0.25, u: "chick" },
          { n: { en: "Fresh clams", fr: "Palourdes fraîches", zh: "蛤蜊" }, q: 250, u: "g", approx: true },
          { n: { en: "King oyster mushroom, thick slices", fr: "Pleurote du panicaut, en tranches épaisses", zh: "杏鮑菇（厚片）" }, q: 1, u: "pc" },
          { n: { en: "Pickled peeled green chilies (bōpí làjiāo), with brine", fr: "Piments verts pelés au vinaigre (bōpí làjiāo), avec la saumure", zh: "剝皮辣椒（連湯汁）" }, q: 0.25, u: "jar" },
          { n: { en: "Goji berries", fr: "Baies de goji", zh: "枸杞" }, q: { txt: { en: "1 small handful", fr: "1 petite poignée", zh: "一小把" } } },
          { n: { en: "Garlic", fr: "Ail", zh: "蒜" }, q: 3, u: "clove" },
          { n: { en: "Sesame oil", fr: "Huile de sésame", zh: "香油" }, q: { txt: { en: "3–5 drops", fr: "3–5 gouttes", zh: "3–5 滴" } } },
          { n: { en: "Rice wine", fr: "Vin de riz", zh: "米酒" }, q: { txt: { en: "3–5 drops", fr: "3–5 gouttes", zh: "3–5 滴" } } },
          { n: { en: "Water", fr: "Eau", zh: "水" }, q: { txt: { en: "enough to cover", fr: "à hauteur", zh: "蓋過食材" } } }
        ]}
      ],
      steps: [
        { t: { en: "Purge the clams", fr: "Purger les palourdes", zh: "吐沙" },
          d: { en: "Soak the clams in salted water for about an hour so they spit out their sand.",
               fr: "Faites tremper les palourdes environ 1 heure dans de l’eau salée pour qu’elles rejettent leur sable.",
               zh: "蛤蜊泡鹽水約 1 小時吐沙。" } },
        { t: { en: "Wash & blanch the chicken", fr: "Laver et blanchir le poulet", zh: "洗雞汆燙" },
          d: { en: "The classic prep for any meat: wash the chicken, dip it briefly into boiling water, rinse it clean again and set aside.",
               fr: "La préparation classique pour toute viande : lavez le poulet, plongez-le brièvement dans l’eau bouillante, rincez-le à nouveau et réservez.",
               zh: "處理肉類的經典步驟：雞肉洗淨，滾水略燙，再沖洗乾淨備用。" } },
        { t: { en: "Cook the clams apart", fr: "Cuire les palourdes à part", zh: "另煮蛤蜊" },
          d: { en: "Simmer the clams in a small pot of water just until they open, then lift them out and set aside. Let the cooking water settle and pour it off gently, leaving the sand at the bottom — keep this clam broth.",
               fr: "Faites cuire les palourdes dans une petite casserole d’eau juste jusqu’à ouverture, puis sortez-les et réservez-les. Laissez l’eau de cuisson reposer et versez-la doucement en laissant le sable au fond — gardez ce bouillon de palourdes.",
               zh: "小鍋加水煮蛤蜊，開口即撈出備用。煮蛤蜊的水靜置沉澱後輕輕倒出——沙留鍋底——蛤蜊高湯留用。" } },
        { t: { en: "Sauté the aromatics", fr: "Faire revenir les aromates", zh: "炒香配料" },
          d: { en: "In the soup pot, lightly brown the king oyster slices and the garlic in a touch of oil. Add the pickled green chilies with a little of their brine and stir-fry briefly to wake up their aroma.",
               fr: "Dans la marmite, faites légèrement dorer les tranches de pleurote et l’ail dans un filet d’huile. Ajoutez les piments verts pelés avec un peu de leur saumure et faites-les revenir brièvement pour réveiller leurs arômes.",
               zh: "湯鍋中少許油，將杏鮑菇片與蒜瓣略煎上色。加入剝皮辣椒和少許湯汁，略炒出香氣。" } },
        { t: { en: "Build the soup", fr: "Monter la soupe", zh: "組湯" },
          d: { en: "Pour in the reserved clam broth, add the blanched chicken, then enough water to cover it.",
               fr: "Versez le bouillon de palourdes réservé, ajoutez le poulet blanchi, puis de l’eau à hauteur.",
               zh: "倒入預留的蛤蜊高湯，放入汆燙好的雞肉，再加水蓋過。" } },
        { t: { en: "Season and simmer", fr: "Assaisonner et mijoter", zh: "調味燉煮" },
          d: { en: "Add the goji berries, sesame oil and rice wine. Boil for about 15 minutes, then reduce to medium heat and simmer 15 minutes more.",
               fr: "Ajoutez les baies de goji, l’huile de sésame et le vin de riz. Faites bouillir environ 15 minutes, puis passez à feu moyen et laissez mijoter encore 15 minutes.",
               zh: "加入枸杞、香油、米酒。大火煮約 15 分鐘，轉中火再煮 15 分鐘。" } },
        { t: { en: "Finish", fr: "Finir", zh: "完成" },
          d: { en: "Slip the clams back in 3–5 minutes before serving, just to reheat them so the meat doesn’t fall from the shells. Serve hot.",
               fr: "Remettez les palourdes 3 à 5 minutes avant de servir, juste pour les réchauffer et que la chair ne se détache pas des coquilles. Servez bien chaud.",
               zh: "上桌前 3–5 分鐘把蛤蜊放回鍋中溫熱即可，以免肉脫殼。趁熱享用。" } }
      ],
      tip: { en: "Taste before salting — the chili brine and the clam broth are already savoury.",
             fr: "Goûtez avant de saler : la saumure des piments et le bouillon de palourdes sont déjà bien savoureux.",
             zh: "加鹽前先試味——剝皮辣椒湯汁和蛤蜊高湯已經很鮮。" }
    },
    {
      id: "fish", def: 1,
      name: { en: "No-Fry Braised Fish", fr: "Poisson braisé sans friture", zh: "免煎紅燒魚" },
      short: { en: "Fish", fr: "Poisson", zh: "紅燒魚" },
      time: "~15 min",
      note: { en: "Japanese-style braise — no frying, no smoke", fr: "Braisage à la japonaise — sans friture ni fumée", zh: "日式煮魚法——免煎免油煙" },
      groups: [
        { label: null, items: [
          { n: { en: "White fish fillets (grouper or similar), ~200 g each", fr: "Filets de poisson blanc (mérou ou similaire), ~200 g pièce", zh: "白肉魚片（石斑或類似），每片約 200 克" }, q: 2, u: "pc" },
          { n: { en: "Ginger, in fine strips", fr: "Gingembre en fine julienne", zh: "薑絲" }, q: { txt: { en: "1 knob", fr: "1 morceau", zh: "一塊" } } },
          { n: { en: "Soy sauce", fr: "Sauce soja", zh: "醬油" }, q: 4, u: "tbsp" },
          { n: { en: "Rice vinegar (white or black)", fr: "Vinaigre de riz (blanc ou noir)", zh: "米醋（白醋或烏醋）" }, q: 1, u: "tbsp" },
          { n: { en: "Water", fr: "Eau", zh: "水" }, q: 400, u: "ml" },
          { n: { en: "Cooking oil", fr: "Huile de cuisson", zh: "食用油" }, q: 1, u: "tbsp" },
          { n: { en: "Cooked rice", fr: "Riz cuit", zh: "白飯" }, q: 2, u: "serv" }
        ]}
      ],
      steps: [
        { t: { en: "Prep the fish", fr: "Préparer le poisson", zh: "處理魚片" },
          d: { en: "Thaw the fillets if frozen, rinse and pat them dry, then score the flesh with a few diagonal cuts so the sauce can penetrate.",
               fr: "Décongelez les filets si besoin, rincez-les et séchez-les, puis entaillez la chair de quelques incisions en diagonale pour que la sauce pénètre.",
               zh: "魚片解凍後洗淨擦乾，魚身斜劃幾刀，讓醬汁入味。" } },
        { t: { en: "Mix the braising sauce", fr: "Préparer la sauce", zh: "調醬汁" },
          d: { en: "Mix the soy sauce with the water — taste and adjust the saltiness — then stir in the vinegar (white or black both work).",
               fr: "Mélangez la sauce soja avec l’eau — goûtez et ajustez la salinité — puis incorporez le vinaigre (blanc ou noir, les deux fonctionnent).",
               zh: "醬油加水調勻——先試鹹淡——再加入米醋（白醋或烏醋皆可）。" } },
        { t: { en: "Warm the ginger", fr: "Chauffer le gingembre", zh: "溫薑絲" },
          d: { en: "Heat the oil over low heat and gently warm the ginger strips without letting them brown.",

  // The week's menu is built from the multipliers: one cook night per recipe with ×N ≥ 1,
  // in RECIPES order (= perishability: clams first, then fish/shrimp, poultry, pork, beef),
  // followed by the leftover nights of the ×2/×3 batches. ×0 recipes are skipped.
  function nightsPlan() {
    const nights = [];
    for (const r of RECIPES) if (prefs.m[r.id] > 0) nights.push({ r: r, lo: false });
    for (const r of RECIPES) for (let i = 1; i < prefs.m[r.id]; i++) nights.push({ r: r, lo: true });
    return nights;
  }

                 zh: "<b>一次煮兩餐：</b>設為 ×2 的食譜第一晚一鍋煮好，之後再加熱——隔天更好吃。" },
    leftovers: { en: "(leftovers)", fr: "(restes)", zh: "（回鍋）" },
    serves: { en: "Serves", fr: "Pour", zh: "供" },
    people2: { en: "people", fr: "pers.", zh: "人" },
    time: { en: "Time", fr: "Temps", zh: "時間" },
    batch1: { en: "one pot =", fr: "une marmite =", zh: "一鍋＝" },
    skipped: { en: "not planned this week", fr: "pas prévue cette semaine", zh: "本週不煮" },
    servings: { en: "servings", fr: "portions", zh: "人份" },
    ingredients: { en: "Ingredients", fr: "Ingrédients", zh: "食材" },
    method: { en: "Method", fr: "Préparation", zh: "作法" },
    backtop: { en: "↑ Back to menu", fr: "↑ Retour au menu", zh: "↑ 回到菜單" }
  };

  // ---------- state ----------
  const PKEY = "weekly-book-prefs-v1";
  let prefs = { p: 2, m: {}, lang: "en" };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PKEY)) || {}); } catch (e) {}
  for (const r of RECIPES) if (![0,1,2,3].includes(prefs.m[r.id])) prefs.m[r.id] = r.def;
  if (!["en","fr","zh"].includes(prefs.lang)) prefs.lang = "en";
  if (!(prefs.p >= 1 && prefs.p <= 8)) prefs.p = 2;
  const save = () => { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) {} };

  // ---------- render ----------
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

  function renderPlan() {
    const L = prefs.lang, plan = document.getElementById("plan");
    plan.innerHTML = "";
    plan.appendChild(el("h2", null, T.plan[L]));
    const ppl = el("div", "ppl");
    ppl.appendChild(el("span", "lbl", T.people[L]));
    const minus = el("button", "step-btn", "−"); minus.type = "button"; minus.disabled = prefs.p <= 1;
    const num = el("b", null, prefs.p);
    const plus = el("button", "step-btn", "+"); plus.type = "button"; plus.disabled = prefs.p >= 8;
    minus.onclick = () => { if (prefs.p > 1) { prefs.p--; save(); renderAll(); } };
    plus.onclick = () => { if (prefs.p < 8) { prefs.p++; save(); renderAll(); } };
    ppl.append(minus, num, plus);
    plan.appendChild(ppl);
    for (const r of RECIPES) {
      const row = el("div", "mrow");
      row.appendChild(el("span", "rname", r.name[L]));
      const seg = el("div", "seg");
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", r.name[L]);
      for (const v of [0, 1, 2, 3]) {
        const b = el("button", prefs.m[r.id] === v ? "on" : "", "×" + v);
        b.type = "button";
        b.setAttribute("aria-pressed", prefs.m[r.id] === v ? "true" : "false");
        b.onclick = () => { prefs.m[r.id] = v; save(); renderAll(); };
        seg.appendChild(b);
      }
      row.appendChild(seg);
      plan.appendChild(row);
    }
    plan.appendChild(el("p", "plan-hint", T.planHint[L]));
  }

  function renderMenu() {
    const L = prefs.lang, menu = document.getElementById("menu");
    menu.innerHTML = "";
    nightsPlan().forEach((m, i) => {
      const a = el("a", null);
      a.href = "#r-" + m.r.id;
      a.append(el("span", "d", dayLabel(i + 1, L)), el("span", "dish", m.r.name[L] + (m.lo ? ' <span class="lo">' + T.leftovers[L] + "</span>" : "")));
      menu.appendChild(a);
    });
    document.getElementById("covernote").innerHTML = T.covernote[prefs.lang];
  }

  function renderRecipes() {
    const L = prefs.lang, root = document.getElementById("recipes");
    root.innerHTML = "";
    for (const r of RECIPES) {
      const M = prefs.m[r.id];
      // ×0: keep the recipe readable at base quantities, greyed out and marked as skipped.
      const f = (prefs.p / 2) * (M || 1);
      const sec = el("section", "recipe" + (M === 0 ? " off" : ""));
      sec.id = "r-" + r.id;

      const head = el("div", "r-head");
      head.appendChild(el("span", "day-badge", r.short[L] + " · ×" + M));
      head.appendChild(el("h3", "r-title", r.name[L]));
      const meta = el("div", "r-meta");
      meta.appendChild(el("span", null, T.serves[L] + " <b>" + prefs.p + "</b> " + T.people2[L]));
      meta.appendChild(el("span", null, T.time[L] + " <b>" + r.time + "</b>"));
      meta.appendChild(el("span", "r-batch", M === 0 ? T.skipped[L] : T.batch1[L] + " " + (prefs.p * M) + " " + T.servings[L]));
      meta.appendChild(el("span", null, r.note[L]));
      head.appendChild(meta);
      sec.appendChild(head);

      const ing = el("div", "ing");
      ing.appendChild(el("h4", null, T.ingredients[L]));
      for (const g of r.groups) {
        if (g.label) ing.appendChild(el("h5", null, g.label[L]));
        const ul = el("ul");
        for (const it of g.items) {
          const li = el("li");
          li.appendChild(el("span", null, it.n[L]));
          li.appendChild(el("span", "q", fmtQ(it.q, it.u, g.fixed ? 1 : f, it.approx, L)));
          ul.appendChild(li);
        }
        ing.appendChild(ul);
        if (g.subnote) ing.appendChild(el("p", "subnote", g.subnote[L]));
      }
      sec.appendChild(ing);

      const steps = el("div", "steps");
      const ol = el("ol");
      for (const s of r.steps) {
        const li = el("li");
        li.appendChild(el("b", null, s.t[L]));
        li.appendChild(el("p", null, s.d[L]));
        ol.appendChild(li);
      }
      steps.appendChild(ol);
      if (r.tip) steps.appendChild(el("div", "tipbox", "<b>💡</b> " + r.tip[L]));
      const back = el("a", "backtop", T.backtop[L]);
      back.href = "#top";
      steps.appendChild(back);
      sec.appendChild(steps);
      root.appendChild(sec);
    }
  }

  function renderAll() {
    const L = prefs.lang;
    document.getElementById("title").textContent = T.title[L];
    for (const k of ["en","fr","zh"]) document.getElementById("lang-" + k).className = L === k ? "on" : "";
    renderPlan(); renderMenu(); renderRecipes();
  }

  document.getElementById("lang-en").onclick = () => { prefs.lang = "en"; save(); renderAll(); };
  document.getElementById("lang-fr").onclick = () => { prefs.lang = "fr"; save(); renderAll(); };
  document.getElementById("lang-zh").onclick = () => { prefs.lang = "zh"; save(); renderAll(); };
  renderAll();
</script>
